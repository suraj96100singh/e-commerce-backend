version: '3.8'

services:
  ###> MySQL Database ###
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_api_db
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
  ###< MySQL Database ###

  ###> PHP Symfony Application ###
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symfony_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - database
    ports:
      - "8000:8000"
  ###< PHP Symfony Application ###

  ###> Nginx Web Server ###
  webserver:
    image: nginx:alpine
    container_name: symfony_webserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  ###< Nginx Web Server ###

volumes:
  database_data:
